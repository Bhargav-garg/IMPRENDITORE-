name: Autonomous Smart Traffic CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test Deep Learning Suite
      run: |
        python -m dl_model.test.test_cnn
        python -m dl_model.test.test_lstm
        python -m dl_model.test.test_yolo

    - name: Test Quantum Computing Engine
      run: |
        python -c "from backend.quantum_engine import QuantumEngine; q = QuantumEngine(); print('[CI PASS] QuantumEngine loaded successfully!')"
